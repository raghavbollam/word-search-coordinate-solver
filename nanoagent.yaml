_ > nanoagent.plugin.v0001.ManifestConfig:
id: word-search-coordinate-solver
name: Word Search Coordinate Solver
version: 0.1.1
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  read_case:
    description: Read the word-search grid and target words for the current task.
  write_solutions:
    description: Save the final structured locations for every target word.

tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  solve-word-search:
    description: Find every target word in a supplied character grid and report canonical coordinates, direction, or a not-found result.
    runner: agent
    tools: [read_case, write_solutions]
    reference: null
    instructions: |-
      First call read_case. The grid is a rectangular list of character rows,
      and matching is exact and case-sensitive.

      For each target word, find a contiguous straight-line occurrence in one
      of these directions: N, NE, E, SE, S, SW, W, NW. Coordinates are
      one-based (row, column), and the direction runs from the first target
      letter to its final letter.

      When a word has multiple occurrences, report the canonical one: scan
      possible start cells in row-major order, then test directions in this
      exact order: N, NE, E, SE, S, SW, W, NW. A one-letter word therefore
      uses direction N. Return exactly one solution per requested target word
      in input order. For a target that is absent, set found to false and all
      coordinates and direction to null.

      Then call write_solutions with the complete result.
