_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "Explain which simplified .gitignore rule determines every file's final status"

summary: "Given root .gitignore contents and a list of repository-relative paths, the agent determines whether each path is ignored or included. It identifies the final matching pattern under a documented subset of .gitignore behavior: exact paths, * wildcards, directory patterns, and ! negation. A deterministic verifier independently applies the same documented rules and checks every submitted path, status, rule number, and winning pattern."

highlights:
  - "Offline and reproducible: every task uses supplied .gitignore text and candidate paths"
  - "Supports exact paths, * wildcards, directory patterns ending in /, and ! negation"
  - "Explains every decision with the final matching pattern and its pattern-only rule number"
  - "Deterministic all-or-nothing verification with precise mismatch diagnostics"

steps:
  - "Provide .gitignore contents and one or more normalized repository-relative candidate paths"
  - "The agent evaluates patterns from top to bottom; the last matching supported rule wins"
  - "Review the ignored or included status, rule number, and winning pattern for every path"