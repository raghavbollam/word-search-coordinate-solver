_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "Find canonical coordinates for every word in a supplied word-search grid"

summary: "Given a rectangular character grid and ordered target words, the agent finds each word in a straight line and reports its 1-based start/end coordinates and direction. When a word occurs more than once, it uses documented row-major and direction-order tie-breaking. A deterministic verifier independently searches the grid and checks every submitted solution."

highlights:
  - "Offline and reproducible: every task supplies the complete grid and target words"
  - "Searches all eight compass directions with exact, case-sensitive character matching"
  - "Reports 1-based start and end coordinates, direction, or an explicit not-found result"
  - "Deterministic all-or-nothing verification with precise mismatch diagnostics"

steps:
  - "Provide a rectangular character grid and one or more target words"
  - "The agent scans start cells row by row and directions in the documented fixed order"
  - "Review the canonical location for each word or its documented not-found result"
